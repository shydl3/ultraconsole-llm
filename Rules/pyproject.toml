[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultra-rules"
version = "0.1.0"
description = "Video semantic analysis for UltraConsole"
requires-python = ">=3.10"
# 依赖复用仓库根 conda 环境（ultralytics/opencv/numpy/pydantic），不在此重复声明安装。
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
